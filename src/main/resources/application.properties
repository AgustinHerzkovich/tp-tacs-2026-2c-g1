spring.application.name=server
spring.docker.compose.enabled=false
weather.provider=${WEATHER_PROVIDER:open-meteo}
weather.open-meteo.forecast-url=https://api.open-meteo.com/v1/forecast
weather.open-meteo.geocoding-url=https://geocoding-api.open-meteo.com/v1/search
weather.connect-timeout=2s
weather.read-timeout=4s
weather.cache.geocoding.ttl=24h
weather.cache.geocoding.maximum-size=1000
weather.cache.current.ttl=15m
weather.cache.current.maximum-size=5000
weather.cache.forecast.ttl=1h
weather.cache.forecast.maximum-size=10000
resilience4j.circuitbreaker.instances.openMeteo.sliding-window-size=10
resilience4j.circuitbreaker.instances.openMeteo.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.openMeteo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openMeteo.wait-duration-in-open-state=30s
resilience4j.retry.instances.openMeteo.max-attempts=2
resilience4j.retry.instances.openMeteo.wait-duration=250ms
resilience4j.retry.instances.openMeteo.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.HttpClientErrorException$TooManyRequests
votation.duration=${VOTATION_DURATION:24h}
