name: Backend CI

on:
  # Sin filtro de paths en PRs: el check "Formato, estilo, análisis estático y
  # tests" es obligatorio, y si el workflow no arranca GitHub lo espera para
  # siempre. El job `changes` decide si hay algo que verificar; si no, `checks`
  # queda "skipped", que cuenta como aprobado.
  pull_request:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detectar cambios en el backend
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  checks:
    name: Formato, estilo, análisis estático y tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Los checks van de más rápido a más lento para fallar cuanto antes. Se
      # invocan los goals explícitamente porque `verify` corre los tests antes
      # que Spotless, Checkstyle y SpotBugs (todos están atados a esa fase).
      - name: Formato (Spotless)
        run: ./mvnw -B spotless:check

      - name: Estilo (Checkstyle)
        run: ./mvnw -B checkstyle:check

      - name: Análisis estático (SpotBugs)
        run: ./mvnw -B compile spotbugs:check

      # Incluye los tests de persistencia con Testcontainers: el runner de
      # GitHub trae Docker, así que levantan un MongoDB real.
      - name: Tests
        run: ./mvnw -B test

      - name: Subir reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
