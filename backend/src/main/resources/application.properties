# General application identity and local infrastructure behavior.
spring.application.name=server
spring.docker.compose.enabled=false

# Optional development data seed; disabled by default and never intended for production.
# Seeds a handful of dev activities/users/one votation on startup when true.
# See com.solnotfound.seed.ActivitySeeder. Off by default; enable per-run
# with APP_SEED_ENABLED=true, never in production.
app.seed.enabled=${APP_SEED_ENABLED:false}

# Weather provider selection, endpoints and HTTP timeouts.
weather.provider=${WEATHER_PROVIDER:open-meteo}
weather.open-meteo.forecast-url=https://api.open-meteo.com/v1/forecast
weather.open-meteo.geocoding-url=https://geocoding-api.open-meteo.com/v1/search
weather.connect-timeout=2s
weather.read-timeout=4s

# Bounded weather caches and their expiration times.
weather.cache.geocoding.ttl=24h
weather.cache.geocoding.maximum-size=1000
weather.cache.current.ttl=15m
weather.cache.current.maximum-size=5000
weather.cache.forecast.ttl=1h
weather.cache.forecast.maximum-size=10000

# Circuit breaker and retry policy for calls to Open-Meteo.
resilience4j.circuitbreaker.instances.openMeteo.sliding-window-size=10
resilience4j.circuitbreaker.instances.openMeteo.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.openMeteo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openMeteo.wait-duration-in-open-state=30s
resilience4j.retry.instances.openMeteo.max-attempts=2
resilience4j.retry.instances.openMeteo.wait-duration=250ms
resilience4j.retry.instances.openMeteo.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.HttpClientErrorException$TooManyRequests

# Voting lifecycle and scheduled activity status checks.
votation.duration=${VOTATION_DURATION:24h}
activity.starting-soon.threshold=${ACTIVITY_STARTING_SOON_THRESHOLD:1h}
activity.status-check-interval=${ACTIVITY_STATUS_CHECK_INTERVAL:5m}

# OpenAPI documentation endpoint.
springdoc.swagger-ui.path=/swagger-ui.html

# MongoDB connection and automatic index creation.
spring.mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USER:admin}:${MONGO_INITDB_ROOT_PASS:password123}@${MONGO_HOST:mongodb}:27017/${MONGO_INITDB_DATABASE:mi_base_de_datos}?authSource=admin
spring.mongodb.auto-index-creation=true

# Multipart upload limits for activity images.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# Image storage provider and MinIO-compatible object storage connection.
storage.provider=${STORAGE_PROVIDER:none}
storage.bucket=${STORAGE_BUCKET:activity-images}
storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${storage.minio.endpoint}}
storage.minio.region=${MINIO_REGION:us-east-1}
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

# Keycloak JWT validation settings for the OAuth2 resource server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SECURITY_JWT_ISSUER_URI:http://localhost:8090/realms/solnotfound}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SECURITY_JWT_JWK_SET_URI:http://keycloak:8080/realms/solnotfound/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${SECURITY_JWT_AUDIENCE:solnotfoundBackend}

# Spring Security diagnostic logging level.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.security.oauth2=${SECURITY_LOG_LEVEL:INFO}
