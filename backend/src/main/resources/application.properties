# General application identity and local infrastructure behavior.
spring.application.name=server
spring.docker.compose.enabled=false
# Optional local secrets file (backend/.env); real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
# Cloud Run terminates TLS and forwards plain HTTP with X-Forwarded-* headers; honor them so
# framework-generated URLs (e.g. the OAuth resource metadata link) use the public https origin.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# Optional development data seed; disabled by default and never intended for production.
# Seeds a handful of dev activities/users/one votation on startup when true.
# See com.solnotfound.seed.ActivitySeeder. Off by default; enable per-run
# with APP_SEED_ENABLED=true, never in production.
app.seed.enabled=${APP_SEED_ENABLED:false}

# Activities store the organizer's time zone, and every deadline is evaluated in it. When this is
# set, activities created before the zone was stored get this IANA zone on startup; blank skips it.
activity.legacy-time-zone=${ACTIVITY_LEGACY_TIME_ZONE:}

# Weather provider selection, endpoints and HTTP timeouts.
weather.provider=${WEATHER_PROVIDER:open-meteo}
weather.open-meteo.forecast-url=https://api.open-meteo.com/v1/forecast
weather.open-meteo.geocoding-url=https://geocoding-api.open-meteo.com/v1/search
weather.connect-timeout=2s
weather.read-timeout=4s

# Bounded weather caches and their expiration times.
weather.cache.geocoding.ttl=24h
weather.cache.geocoding.maximum-size=1000
weather.cache.current.ttl=15m
weather.cache.current.maximum-size=5000
weather.cache.forecast.ttl=1h
weather.cache.forecast.maximum-size=10000

# Circuit breaker and retry policy for calls to Open-Meteo.
resilience4j.circuitbreaker.instances.openMeteo.sliding-window-size=10
resilience4j.circuitbreaker.instances.openMeteo.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.openMeteo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openMeteo.wait-duration-in-open-state=30s
resilience4j.retry.instances.openMeteo.max-attempts=2
resilience4j.retry.instances.openMeteo.wait-duration=250ms
resilience4j.retry.instances.openMeteo.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.HttpClientErrorException$TooManyRequests

# Legacy weather provider (Humedad, Datos y Pronosticos S.A.). Values measured while probing it: a
# valid answer takes 3-10 ms and at most ~1 s; about 21% of calls never answer and about 20% answer
# 200 with something unusable. See the README section "Proveedor de clima legacy".
weather.legacy.base-url=${LEGACY_WEATHER_URL:http://localhost:9978}
weather.legacy.api-token=${LEGACY_WEATHER_TOKEN:}
weather.legacy.api-token-file=${LEGACY_WEATHER_TOKEN_FILE:}
weather.legacy.connect-timeout=${LEGACY_WEATHER_CONNECT_TIMEOUT:500ms}
# 1.5 s is above every valid answer seen and cuts the calls that would hang forever.
weather.legacy.read-timeout=${LEGACY_WEATHER_READ_TIMEOUT:1500ms}
# The service answers the same for the same place and hour, so valid answers are reused for an hour.
weather.legacy.cache-ttl=${LEGACY_WEATHER_CACHE_TTL:1h}
weather.legacy.cache-maximum-size=10000
weather.legacy.user-requests-per-minute=${LEGACY_WEATHER_USER_REQUESTS_PER_MINUTE:30}
# Set on Cloud Run, where the legacy service is private and needs the caller's identity token.
weather.legacy.cloud-run-audience=${LEGACY_WEATHER_AUDIENCE:}

# Retry (only transient failures; an unreachable service is not retried): about 42% of single
# attempts fail, so 3 attempts leave ~7% of lookups failing. Backoff is
# exponential (100 ms, 200 ms) with +-50% jitter so retries of many clients do not line up.
resilience4j.retry.instances.legacyWeather.max-attempts=3
resilience4j.retry.instances.legacyWeather.wait-duration=100ms
resilience4j.retry.instances.legacyWeather.enable-exponential-backoff=true
resilience4j.retry.instances.legacyWeather.exponential-backoff-multiplier=2
resilience4j.retry.instances.legacyWeather.enable-randomized-wait=true
resilience4j.retry.instances.legacyWeather.randomized-wait-factor=0.5
resilience4j.retry.instances.legacyWeather.retry-exception-predicate=com.solnotfound.adapters.legacy.LegacyRetryPredicate
# Circuit breaker around the retried lookup: normally ~7% of lookups fail, so opening at 50% over
# the last 20 (with at least 10) only happens when the service is really down. While open, the main
# provider answers for 30 s; then 3 trial lookups decide whether to close it.
resilience4j.circuitbreaker.instances.legacyWeather.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.legacyWeather.sliding-window-size=20
resilience4j.circuitbreaker.instances.legacyWeather.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.legacyWeather.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.legacyWeather.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.legacyWeather.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.legacyWeather.record-failure-predicate=com.solnotfound.adapters.legacy.LegacyProviderFaultPredicate
# Lookups turned away by the bulkhead or the rate limiter never reached the service: they neither
# count as failures nor as successes, or they would hide a hanging service.
resilience4j.circuitbreaker.instances.legacyWeather.ignore-exception-predicate=com.solnotfound.adapters.legacy.LegacyRefusalPredicate
# Rate limit toward the service: at most 20 calls per second from this instance; a call that cannot
# get a permit within 100 ms is answered by the main provider instead of waiting.
resilience4j.ratelimiter.instances.legacyWeather.limit-for-period=20
resilience4j.ratelimiter.instances.legacyWeather.limit-refresh-period=1s
resilience4j.ratelimiter.instances.legacyWeather.timeout-duration=100ms
# Back pressure: at most 10 calls in flight. Hung calls hold a slot until the read timeout, so the
# excess is turned away after 100 ms instead of queuing behind them.
resilience4j.bulkhead.instances.legacyWeather.max-concurrent-calls=10
resilience4j.bulkhead.instances.legacyWeather.max-wait-duration=100ms
# Snapshot of every weather provider for the statistics (status, breaker state, cache counters).
weather.monitor.cron=${WEATHER_MONITOR_CRON:0 * * * * *}

# Voting lifecycle and scheduled activity status checks.
app.scheduling.beans-enabled=${APP_SCHEDULING_BEANS_ENABLED:true}
activity.weather-check-cron=${ACTIVITY_WEATHER_CHECK_CRON:0 0 * * * *}
activity.weather-check-on-startup=${ACTIVITY_WEATHER_CHECK_ON_STARTUP:true}
votation.duration=${VOTATION_DURATION:24h}
# Minimum participation (0..1) every new votation starts with; the organizer can change it later.
votation.min-quorum=${VOTATION_MIN_QUORUM:0.5}
activity.starting-soon.threshold=${ACTIVITY_STARTING_SOON_THRESHOLD:1h}
activity.status-check-cron=${ACTIVITY_STATUS_CHECK_CRON:0 */5 * * * *}
votation.closing-check-cron=${VOTATION_CLOSING_CHECK_CRON:0 0 * * * *}
votation.closing-check-on-startup=${VOTATION_CLOSING_CHECK_ON_STARTUP:true}

# OpenAPI documentation endpoint.
springdoc.swagger-ui.path=/swagger-ui.html

# MongoDB connection and automatic index creation.
spring.mongodb.uri=${MONGODB_URI:mongodb://${MONGO_INITDB_ROOT_USER:admin}:${MONGO_INITDB_ROOT_PASS:password123}@${MONGO_HOST:mongodb}:27017/${MONGO_INITDB_DATABASE:mi_base_de_datos}?authSource=admin}
spring.data.mongodb.auto-index-creation=true

# Multipart upload limits for activity images.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# Image storage provider and MinIO-compatible object storage connection.
storage.provider=${STORAGE_PROVIDER:none}
storage.bucket=${STORAGE_BUCKET:activity-images}
storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${storage.minio.endpoint}}
storage.minio.region=${MINIO_REGION:us-east-1}
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

# Keycloak JWT validation settings for the OAuth2 resource server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SECURITY_JWT_ISSUER_URI:http://localhost:8090/realms/solnotfound}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SECURITY_JWT_JWK_SET_URI:http://keycloak:8080/realms/solnotfound/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${SECURITY_JWT_AUDIENCE:solnotfoundBackend}

# Spring Security diagnostic logging level.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.springframework.security.oauth2=${SECURITY_LOG_LEVEL:INFO}

# Google OIDC identity accepted by the internal Cloud Scheduler endpoints.
scheduler.oidc.audience=${SCHEDULER_OIDC_AUDIENCE:http://localhost:8080}
scheduler.oidc.email=${SCHEDULER_OIDC_EMAIL:planazo-local-scheduler@example.invalid}

# Static API token required from the Telegram bot on /users/telegram/**; blank rejects every call.
telegram.api-token=${TELEGRAM_API_TOKEN:}
