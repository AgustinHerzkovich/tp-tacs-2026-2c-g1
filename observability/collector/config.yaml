# OpenTelemetry Collector: single entry point for the telemetry of the browser, the Next.js server
# and the backend. Traces go to Jaeger; metrics are exposed for Prometheus to scrape.
# See docs/OBSERVABILIDAD.md for the path of each signal.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        # The browser posts its spans straight to the collector from the app's origin.
        cors:
          allowed_origins:
            - http://localhost:3000
            - http://127.0.0.1:3000

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # The search text and every other query parameter stay out of the traces: query strings are cut
  # from URLs and span names before they are stored.
  transform/redact-queries:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "url.query")
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - replace_pattern(attributes["http.target"], "\\?.*$", "")
          - replace_pattern(name, "\\?.*$", "")

  # Tags every span and metric with the environment, to tell local telemetry apart from any other.
  resource/environment:
    attributes:
      - key: deployment.environment.name
        value: local
        action: upsert

  batch:
    timeout: 1s

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, transform/redact-queries, batch]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [prometheus]
