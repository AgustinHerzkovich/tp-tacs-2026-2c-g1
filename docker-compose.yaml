services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: ${NEXT_PUBLIC_KEYCLOAK_URL:-http://localhost:8090}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${NEXT_PUBLIC_KEYCLOAK_REALM:-solnotfound}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${NEXT_PUBLIC_KEYCLOAK_CLIENT_ID:-solnotfoundFrontend}
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_started
    networks:
      - tacs-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
      STORAGE_PROVIDER: minio
      STORAGE_BUCKET: ${STORAGE_BUCKET:-activity-images}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MONGO_INITDB_ROOT_USER: ${MONGO_INITDB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASS: ${MONGO_INITDB_ROOT_PASS:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-mi_base_de_datos}
      SECURITY_JWT_ISSUER_URI: ${SECURITY_JWT_ISSUER_URI:-http://localhost:8090/realms/solnotfound}
      SECURITY_JWT_JWK_SET_URI: ${SECURITY_JWT_JWK_SET_URI:-http://keycloak:8080/realms/solnotfound/protocol/openid-connect/certs}
      SECURITY_JWT_AUDIENCE: ${SECURITY_JWT_AUDIENCE:-solnotfoundBackend}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
    depends_on:
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
    networks:
      - tacs-network

  mongodb:
    image: mongo:8.0.14
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASS:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-mi_base_de_datos}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_INITDB_ROOT_USER:-admin}",
          "--password",
          "${MONGO_INITDB_ROOT_PASS:-password123}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tacs-network

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tacs-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak
    ports:
      - "8090:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-import:/opt/keycloak/data/import:ro
      - ./keycloak-theme/planazo:/opt/keycloak/themes/planazo:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/solnotfound HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tacs-network

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.7.3
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/keycloak/bin/kcadm.sh config credentials
        --server http://keycloak:8080 --realm master --user admin --password admin &&
        /opt/keycloak/bin/kcadm.sh update realms/solnotfound
        -s displayName=Planazo -s displayNameHtml=Planazo -s loginTheme=planazo
    networks:
      - tacs-network

volumes:
  mongodb-data:
  minio-data:
  keycloak-data:

networks:
  tacs-network:
    driver: bridge
