services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
      STORAGE_PROVIDER: minio
      STORAGE_BUCKET: ${STORAGE_BUCKET:-activity-images}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MONGO_INITDB_ROOT_USER: ${MONGO_INITDB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASS: ${MONGO_INITDB_ROOT_PASS:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-mi_base_de_datos}
    depends_on:
      minio:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - tacs-network

  mongodb:
    image: mongo:8.0.14
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASS:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-mi_base_de_datos}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_INITDB_ROOT_USER:-admin}",
          "--password",
          "${MONGO_INITDB_ROOT_PASS:-password123}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tacs-network

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tacs-network

volumes:
  mongodb-data:
  minio-data:

networks:
  tacs-network:
    driver: bridge
